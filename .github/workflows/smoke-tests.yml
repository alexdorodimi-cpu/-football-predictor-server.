name: Football Predictor smoke tests

on:
  push:
    branches:
      - automation/smoke-tests
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check server JavaScript syntax
        run: node --check server.js

      - name: Run API smoke tests
        env:
          BASE_URL: https://football-predictor-server-1-b267.onrender.com
          PREDICTOR_ACCESS_TOKEN: ${{ secrets.PREDICTOR_ACCESS_TOKEN }}
          TEST_MATCH_ID: ${{ vars.TEST_MATCH_ID }}
        run: node scripts/smoke-test.js
